; UI test firmware and host tests for the light control UI.
;
;   pio run -e ui-test -t upload           flash the UI test firmware (real OLED + buttons, fake lights)
;   pio device monitor -e ui-test          watch the fake lights change
;   pio test -e native -f test_ui          run the UI tests on this computer
;   pio test -e native -f test_preview     draw every screen to docs/preview/*.png
;
; src/ is the UI test firmware; the UI itself is the library in this repo (library.json, which pulls
; oled-lcd-icons from GitHub). ESPHome ignores all of this and uses components/ directly.

[platformio]
default_envs = ui-test

[env]
build_unflags = -std=gnu++11
build_flags = -std=gnu++17

[env:ui-test]
platform = espressif32@6.10.0
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
lib_deps =
  symlink://.
  olikraus/U8g2@^2.36.5

[env:native]
platform = native
test_framework = unity
; Unity listed explicitly: the dependency finder doesn't always pick it up from the tests
lib_deps =
  symlink://.
  throwtheswitch/Unity@^2.6.1
build_flags =
  ${env.build_flags}
  -D LCUI_FONTS_DIR=\"${PROJECT_DIR}/fonts\"
  -D LCUI_PREVIEW_DIR=\"${PROJECT_DIR}/docs/preview\"
